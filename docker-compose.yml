version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aicte-postgres
    environment:
      POSTGRES_DB: aicte_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - aicte-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aicte_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - aicte-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aicte-network

volumes:
  postgres_data:

networks:
  aicte-network:
    driver: bridge
